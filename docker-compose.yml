include:
    - ./langpro-container/compose.yaml

services:
    postgres:
        container_name: la-postgres
        image: postgres:15
        environment:
            - POSTGRES_PASSWORD=postgres
        healthcheck:
            test: 'psql -c "\l" postgres postgres'
        restart: always
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./backend/create_db.sql:/docker-entrypoint-initdb.d/langpro.sql
        ports:
            - 127.0.0.1:5433:5432

    backend-prod: &backend-prod
        container_name: la-backend
        image: la-backend-prod
        profiles: ["prod"]
        build: ./backend
        restart: unless-stopped
        environment:
            - PGHOST=postgres
            - LANGPRO_CONTAINER=http://langpro:80
            - LANGPRO_FRONTEND=http://localhost:4200
            - DJANGO_DEBUG=0
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: 'curl -f localhost:8000/admin/'
        volumes:
            - ./:/usr/src/app
            - ./logs/django:/usr/src/app/logs
        expose:
            - 8000
        command: >
            gunicorn langpro_annotator.wsgi:application
            -w 4
            -b 0.0.0.0:8000
            --timeout 600
            --access-logfile /usr/src/app/logs/access_log
            --error-logfile /usr/src/app/logs/error_log
            --capture-output

    backend-dev:
        <<: *backend-prod
        image: la-backend-dev
        restart: no
        profiles: ["dev"]
        environment:
            - PGHOST=postgres
            - LANGPRO_CONTAINER=http://langpro:80
            - LANGPRO_FRONTEND=http://localhost:4200
            - DJANGO_DEBUG=1
        ports:
            - 127.0.0.1:8000:8000
    frontend:
        container_name: la-frontend
        build:
            context: ./frontend
        healthcheck:
            test: 'curl -f localhost:4200'
        volumes:
            - ./:/usr/src/app
            - frontend-node-modules:/usr/src/app/frontend/node_modules
        ports:
            - 127.0.0.1:4200:4200
            - 127.0.0.1:9876:9876

volumes:
    postgres-data:
    frontend-node-modules:
