include:
    - ./langpro-container/compose.yaml

services:
    postgres:
        image: postgres:15
        environment:
            - POSTGRES_PASSWORD=postgres
        healthcheck:
            test: 'psql -c "\l" postgres postgres'
        restart: always
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./backend/create_db.sql:/docker-entrypoint-initdb.d/langpro.sql
        ports:
            - 127.0.0.1:5433:5432
    backend:
        build:
            context: ./backend
        environment:
            PGHOST: postgres
            LANGPRO_CONTAINER: 'http://langpro:80'
            LANGPRO_FRONTEND: 'http://frontend:4200'
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: 'curl -f localhost:8000/admin/'
        volumes:
            - ./:/usr/src/app
        ports:
            - 127.0.0.1:8000:8000
    frontend:
        build:
            context: ./frontend
        healthcheck:
            test: 'curl -f localhost:4200'
        volumes:
            - ./:/usr/src/app
            - frontend-node-modules:/usr/src/app/frontend/node_modules
        ports:
            - 127.0.0.1:4200:4200
            - 127.0.0.1:9876:9876

volumes:
    postgres-data:
    frontend-node-modules:
