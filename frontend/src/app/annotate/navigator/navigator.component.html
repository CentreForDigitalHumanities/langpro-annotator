@let problem = problem$ | async; @let proofBankStats = proofBankStats$ | async;

<div class="navigator-container">
    <div class="d-flex justify-content-between align-items-center gap-2">
        <div class="responsive-button-grid">
            <button
                class="btn btn-outline-primary btn-sm py-1 text-nowrap"
                (click)="navigateToProblem(proofBankStats?.firstProblemId)"
                [disabled]="problem?.id === proofBankStats?.firstProblemId"
                ngbTooltip="First Problem"
                i18n-ngbTooltip
            >
                <fa-icon
                    [icon]="faAnglesLeft"
                    class="me-1"
                    aria-hidden="true"
                />
                <span i18n>First</span>
            </button>
            <button
                class="btn btn-outline-primary btn-sm px-2 py-1 text-nowrap"
                (click)="navigateToProblem(problem?.previous)"
                [disabled]="problem?.previous === null"
                ngbTooltip="Previous Problem"
                i18n-ngbTooltip
            >
                <fa-icon [icon]="faAngleLeft" class="me-1" aria-hidden="true" />
                <span i18n>Previous</span>
            </button>
        </div>

        <div class="px-2 text-center">
            @if (problem && problem.index !== null && proofBankStats &&
            proofBankStats.totalProblems) {
            <span class="small" i18n>
                {{ problem.index }} of {{ proofBankStats.totalProblems }}
            </span>
            }
        </div>

        <div class="responsive-button-grid">
            <button
                class="btn btn-outline-primary btn-sm py-1 text-nowrap"
                (click)="navigateToProblem(problem?.next)"
                [disabled]="problem?.next === null"
                ngbTooltip="Next Problem"
                i18n-ngbTooltip
            >
                <span i18n>Next</span>
                <fa-icon
                    [icon]="faAngleRight"
                    class="ms-1"
                    aria-hidden="true"
                />
            </button>
            <button
                class="btn btn-outline-primary btn-sm py-1 text-nowrap"
                (click)="navigateToProblem(proofBankStats?.lastProblemId)"
                [disabled]="problem?.id === proofBankStats?.lastProblemId"
                ngbTooltip="Last Problem"
                i18n-ngbTooltip
            >
                <span i18n>Last</span>
                <fa-icon
                    [icon]="faAnglesRight"
                    class="ms-1"
                    aria-hidden="true"
                />
            </button>
        </div>
    </div>
</div>
