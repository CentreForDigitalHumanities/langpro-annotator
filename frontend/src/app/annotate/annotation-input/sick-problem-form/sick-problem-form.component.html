<div class="card">
    <div class="card-header">
        <h3 class="card-title" i18n>
            SICK Problem Details (ID: {{ problem.pairId }})
        </h3>
    </div>
    <div class="card-body">
        <div class="mb-3">
            <strong i18n>Sentence 1:</strong>
            <p>{{ problem.sentenceOne }}</p>
        </div>
        <div class="mb-3">
            <strong i18n>Sentence 2:</strong>
            <p>{{ problem.sentenceTwo }}</p>
        </div>
        <div class="mb-3">
            <strong i18n>Entailment Label:</strong>
            <p>{{ problem.entailmentLabel }}</p>
        </div>
        <div class="mb-3">
            <strong i18n>Relatedness Score:</strong>
            <p>{{ problem.relatednessScore }}</p>
        </div>
    </div>
</div>
