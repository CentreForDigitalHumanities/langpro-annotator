@let problem = problem$ | async; @let proofBankStats = proofBankStats$ | async;

<div class="navigator-container">
    <div class="d-flex justify-content-between align-items-center gap-2">
        <div class="responsive-button-grid">
            <button
                class="btn btn-outline-primary btn-sm"
                type="button"
                (click)="navigateToProblem(proofBankStats?.firstProblemId)"
                [disabled]="problem?.id === proofBankStats?.firstProblemId"
                aria-labelledby="label-first"
                title="First problem"
                title-i18n
            >
                <fa-icon
                    [icon]="faAnglesLeft"
                    aria-hidden="true"
                    focusable="false"
                />
                <span id="label-first" class="visually-hidden" i18n>
                    First</span
                >
            </button>
            <button
                class="btn btn-outline-primary btn-sm"
                type="button"
                (click)="navigateToProblem(problem?.previous)"
                [disabled]="problem?.previous === null"
                aria-labelledby="label-previous"
                title="Previous problem"
                title-i18n
            >
                <fa-icon
                    [icon]="faAngleLeft"
                    aria-hidden="true"
                    focusable="false"
                />
                <span id="label-previous" class="visually-hidden" i18n
                    >Previous</span
                >
            </button>
        </div>

        <div class="px-2 text-center flex-grow-1">
            @if (problem && problem.index !== null && proofBankStats &&
            proofBankStats.totalProblems) {
            <span class="small" i18n>
                {{ problem.index }}
            </span>
            <hr class="my-1">
            <span class="small" i18n>{{ proofBankStats.totalProblems }}</span>
            }
        </div>

        <div class="responsive-button-grid">
            <button
                class="btn btn-outline-primary btn-sm"
                type="button"
                (click)="navigateToProblem(problem?.next)"
                [disabled]="problem?.next === null"
                title="Next problem"
                title-i18n
            >
                <span id="label-next" class="visually-hidden" i18n>Next</span>
                <fa-icon
                    [icon]="faAngleRight"
                    aria-hidden="true"
                    focusable="false"
                />
            </button>
            <button
                class="btn btn-outline-primary btn-sm"
                (click)="navigateToProblem(proofBankStats?.lastProblemId)"
                [disabled]="problem?.id === proofBankStats?.lastProblemId"
                title="Last problem"
                title-i18n
            >
                <span id="label-last" class="visually-hidden" i18n>Last</span>
                <fa-icon
                    [icon]="faAnglesRight"
                    aria-hidden="true"
                    focusable="false"
                />
            </button>
        </div>
    </div>
</div>
