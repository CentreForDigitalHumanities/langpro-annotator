@if (problem?.id) {
<div class="card">
    <div class="card-body">
        <la-problem-details [problem]="problem" />
        @if (form) {
        <div class="d-flex flex-column">
            <la-premises-form [form]="form" />
            <hr />
            <la-knowledge-base-form [form]="form" />
        </div>
        <div class="d-flex justify-content-between mt-3">
            <button
                type="button"
                class="btn btn-success d-flex align-items-center justify-content-center"
                (click)="startParse()"
            >
                <fa-icon
                    [icon]="faTree"
                    class="fa-md"
                    aria-hidden="true"
                    focusable="false"
                ></fa-icon>
                <span class="ms-3" i18n>Start parse</span>
            </button>
            @if (showSaveButton$ | async) {
            <button
                type="button"
                class="btn btn-primary d-flex align-items-center justify-content-center"
                (click)="saveProblem()"
            >
                <fa-icon
                    [icon]="faFloppyDisk"
                    class="fa-md"
                    aria-hidden="true"
                    focusable="false"
                ></fa-icon>
                <span class="ms-3" i18n>Save problem</span>
            </button>
            }
        </div>
        }
    </div>
</div>
} @else {
<div class="h-100 d-flex align-items-center justify-content-center text-muted">
    <fa-icon [icon]="faExclamationCircle"></fa-icon>
    <h2 class="h4 mb-0 ms-2">
        There are no problems matching your search criteria.
    </h2>
</div>
}
